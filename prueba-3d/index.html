<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Prueba 3D | CULTHOUSE</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@300;500&family=Work+Sans:wght@300;400;500&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
:root{--papel:#131210;--tinta:#ece7dc;--gris:#9b968b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--papel);color:var(--tinta);font-family:"Work Sans",system-ui,sans-serif}
.escena{position:relative;height:100svh;min-height:520px;overflow:hidden;cursor:crosshair}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
h1{position:absolute;left:0;right:0;top:4vh;margin:0;text-align:center;font-family:"Big Shoulders Display","Arial Narrow",sans-serif;font-weight:300;text-transform:uppercase;line-height:.85;font-size:calc((100vw - 36px) / 4.4);letter-spacing:-.01em;pointer-events:none;text-shadow:0 2px 30px rgba(0,0,0,.35)}
.pista{position:absolute;left:50%;bottom:5vh;transform:translateX(-50%);font-family:Caveat,cursive;font-size:26px;color:#f1ece2;opacity:.9;pointer-events:none;transition:opacity .8s;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.pista.fuera{opacity:0}
.ctrl{position:absolute;right:16px;bottom:16px;display:flex;gap:8px;font-size:12px}
.ctrl button{background:rgba(0,0,0,.45);color:#f1ece2;border:1px solid rgba(241,236,226,.4);padding:6px 10px;cursor:pointer;font:inherit}
.ctrl button[aria-pressed="true"]{background:#f1ece2;color:#161512}
</style>
</head>
<body>
<div class="escena" id="escena">
  <canvas id="lienzo"></canvas>
  <h1>Culthouse</h1>
  <p class="pista" id="pista">mueve el ratón</p>
  <div class="ctrl"><span style="align-self:center;color:#cfc9bd">Intensidad:</span><button data-k="0.018">suave</button><button data-k="0.03" aria-pressed="true">media</button><button data-k="0.05">fuerte</button></div>
</div>
<script>
(function(){
  var cv=document.getElementById('lienzo'), gl=cv.getContext('webgl');
  var vs='attribute vec2 p;varying vec2 uv;void main(){uv=p*0.5+0.5;uv.y=1.0-uv.y;gl_Position=vec4(p,0.,1.);}';
  var fs='precision mediump float;varying vec2 uv;uniform sampler2D img,dep;uniform vec2 m;uniform float k;uniform vec2 esc,off;'+
    'void main(){vec2 u=uv*esc+off;float d=texture2D(dep,u).r;vec2 s=m*k*(d-0.35);'+
    'vec2 q=u+s;q=clamp(q,0.0,1.0);gl_FragColor=texture2D(img,q);}';
  function sh(t,s){var o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o;}
  var pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);
  var b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  var lp=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(lp);gl.vertexAttribPointer(lp,2,gl.FLOAT,false,0,0);
  function tex(u,unit,cb){var t=gl.createTexture(),im=new Image();im.crossOrigin='anonymous';im.onload=function(){gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,t);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,im);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);cb();};im.src=u;}
  var listos=0;function ok(){if(++listos===2){gl.uniform1i(gl.getUniformLocation(pr,'img'),0);gl.uniform1i(gl.getUniformLocation(pr,'dep'),1);requestAnimationFrame(pinta);}}
  tex('casa.jpg',0,ok);tex('profundidad.png',1,ok);
  var uM=gl.getUniformLocation(pr,'m'),uK=gl.getUniformLocation(pr,'k'),uE=gl.getUniformLocation(pr,'esc'),uO=gl.getUniformLocation(pr,'off');
  var K=0.03, obj=[0,0], cur=[0,0], ultimo=0, tocado=false;
  function tam(){var r=devicePixelRatio||1;cv.width=cv.clientWidth*r;cv.height=cv.clientHeight*r;gl.viewport(0,0,cv.width,cv.height);
    var ai=16/9, ac=cv.width/cv.height, z=0.92, ex=z, ey=z; if(ac>ai){ey=z*ai/ac;}else{ex=z*ac/ai;} gl.uniform2f(uE,ex,ey);gl.uniform2f(uO,(1-ex)/2,(1-ey)/2);}
  addEventListener('resize',tam);tam();
  var pista=document.getElementById('pista');
  addEventListener('pointermove',function(e){obj=[(e.clientX/innerWidth-0.5)*2,(e.clientY/innerHeight-0.5)*2];ultimo=performance.now();if(!tocado){tocado=true;setTimeout(function(){pista.classList.add('fuera')},1800);}});
  function pinta(t){ if(performance.now()-ultimo>3000){obj=[Math.sin(t/2600)*0.6,Math.sin(t/3700)*0.25];}
    cur[0]+=(obj[0]-cur[0])*0.06;cur[1]+=(obj[1]-cur[1])*0.06;gl.uniform2f(uM,cur[0],cur[1]);gl.uniform1f(uK,K);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);requestAnimationFrame(pinta);}
  document.querySelectorAll('.ctrl button').forEach(function(bt){bt.addEventListener('click',function(){K=parseFloat(bt.dataset.k);document.querySelectorAll('.ctrl button').forEach(function(x){x.setAttribute('aria-pressed',x===bt)});});});
})();
</script>
</body>
</html>
